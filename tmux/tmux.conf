# tmux configuration
# Prefix: C-a (double-tap C-a C-a to send literal C-a to terminal)

# ─── Prefix ──────────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ─────────────────────────────────────────────────────────────────

# Requires tmux-256color terminfo (ships with Homebrew ncurses / macOS Ventura+).
# Fallback: change to "screen-256color" if terminfo is missing.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on

# ─── Keybinds ────────────────────────────────────────────────────────────────

# Reload config.
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Splits — use | and - for intuitive orientation.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation — seamless vim↔tmux via vim-tmux-navigator.
# C-h/j/k/l works without prefix in both vim and tmux.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Restore C-l for clear screen (prefix + C-l).
bind C-l send-keys 'C-l'

# Pane resize — vim-style with repeat.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation.
bind -r n next-window
bind -r p previous-window

# New window in current path.
bind c new-window -c "#{pane_current_path}"

# Kill pane/window without confirmation.
bind x kill-pane
bind X kill-window

# ─── Copy mode (vi) ─────────────────────────────────────────────────────────

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ─── Status bar ──────────────────────────────────────────────────────────────

set -g status-position bottom
set -g status-style "bg=#005f87,fg=#e4e4e4"
set -g status-left " [#S] "
set -g status-right " %H:%M "
set -g status-left-length 20
setw -g window-status-current-style "bg=#0087af,fg=#eeeeee,bold"
setw -g window-status-style "fg=#bcbcbc"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# ─── Pane borders ────────────────────────────────────────────────────────────

set -g pane-border-style "fg=#d0d0d0"
set -g pane-active-border-style "fg=#ff8700,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
